<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Inventory Manager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container">
    <h1>Inventory Manager</h1>

    <!-- Form Input -->
    <form id="inventory-form" class="form-grid">
      <input type="text" id="item-name" placeholder="Item Name" required>
      <input type="number" id="item-price" placeholder="Price (₱)" step="0.01" min="0" required>
      <input type="number" id="item-qty" placeholder="Qty" min="1" required>
      <button type="submit">Add Item</button>
    </form>

    <!-- Table Output -->
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total Value</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="inventory-body"></tbody>
    </table>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
